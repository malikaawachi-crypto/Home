<style>
:root{--bg:#fdf6e3;--ink:#1f2937;--mut:#64748b;--card:#fffdf7;--line:#e7d6b0;--brand:#0d9488;--brand-d:#0f766e;--red:#ce1126;--soft:rgba(13,148,136,.1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--ink:#f5f5f4;--mut:#a8a29e;--card:#292524;--line:#44403c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1917;--ink:#f5f5f4;--mut:#a8a29e;--card:#292524;--line:#44403c;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;direction:rtl}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--red);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px))!important;padding-right:max(16px,env(safe-area-inset-right,0px))!important;background:var(--red);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.25);border-bottom:6px solid #fff}
header h1{margin:0;font-size:1.05rem;font-weight:900}.prog{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:99px;font-weight:800}
main{max-width:1000px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(120,53,15,.08)}
.hero h1{margin:0 0 4px;font-size:1.4rem;color:var(--red)}.hero p{margin:0 0 10px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font:inherit;font-weight:700;border:2px solid var(--c);background:transparent;color:var(--ink);border-radius:99px;padding:3px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}.chip:hover{background:var(--c);color:#fff}.dot{width:10px;height:10px;border-radius:50%}
.house-wrap{position:relative;border-radius:20px;overflow:hidden;border:3px solid #b45309;margin-bottom:12px;background:#7dd3fc}.house-svg{display:block;width:100%;height:auto}
.room{cursor:pointer}.room-ring{opacity:0;transition:.2s}.room:hover .room-ring,.room.near .room-ring{opacity:1}.room.near{filter:drop-shadow(0 0 8px rgba(255,255,255,.9))}
.pulse-tag{animation:pul 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob .6s ease-in-out infinite alternate}.cloud{animation:cl 40s linear infinite alternate}.dhow{animation:dh 14s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}@keyframes cl{to{transform:translateX(120px)}}@keyframes dh{to{transform:translateX(60px)}}@keyframes pul{50%{transform:scale(1.2)}}
.toast{position:absolute;bottom:12px;left:50%;transform:translate(-50%,20px);background:#1f2937;color:#fff;padding:10px 16px;border-radius:14px;max-width:88%;opacity:0;pointer-events:none;transition:.3s;font-weight:700;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.dpad{text-align:center}.near-hint{font-weight:800;margin-bottom:8px;color:var(--brand)}.pad{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.tiny{font-size:.8rem;color:var(--mut);margin:8px 0 0}
button{font-family:inherit}.btn-round{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 16px;font-weight:800;font-size:1rem;cursor:pointer}.btn-round:hover{background:var(--line)}
.btn-main{border:0;background:var(--brand);color:#fff;border-radius:14px;padding:10px 22px;font-weight:900;font-size:1rem;cursor:pointer;box-shadow:0 4px 0 var(--brand-d)}.btn-main:active{transform:translateY(3px);box-shadow:none}.btn-main:disabled{cursor:not-allowed}
.btn-sec{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:9px 18px;font-weight:800;cursor:pointer}.link{background:none;border:0;color:var(--mut);cursor:pointer;text-decoration:underline}
.center{text-align:center}.row{display:flex;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}.row.end{justify-content:flex-end}
.narrow{max-width:760px;margin:0 auto}.two{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.scene-frame{border-radius:16px;overflow:hidden;border:3px solid var(--line);background:#fff}.scene-frame.g{border-color:#16a34a}.scene-frame.w{border-color:#f59e0b}.scene-frame.d{border-color:#dc2626}
.scene-svg{display:block;width:100%;height:auto}
.narr{font-size:1.05rem;margin:12px 2px}.narr.big{font-size:1.2rem;font-weight:800}.q{margin:6px 0 10px;font-size:1.15rem;font-weight:900}
.tag{color:#fff;font-weight:800;padding:3px 14px;border-radius:99px;font-size:.9rem;display:inline-block;margin-bottom:8px}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}.step{color:var(--mut);font-weight:700}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}.bar i{display:block;height:100%;border-radius:9px;transition:width .4s}
.choices{display:grid;gap:10px}.choice{display:flex;gap:12px;align-items:flex-start;text-align:right;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:12px;font-size:1rem;cursor:pointer;transition:.15s}.choice:hover{border-color:var(--brand);transform:translateX(-4px);background:var(--soft)}
.choice b{background:var(--brand);color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.verdict{font-weight:900;padding:3px 12px;border-radius:99px}.verdict.g{background:#dcfce7;color:#14532d}.verdict.w{background:#fef3c7;color:#78350f}.verdict.d{background:#fee2e2;color:#7f1d1d}
.you{background:rgba(100,116,139,.12);border-radius:12px;padding:8px 12px;margin-top:10px;font-weight:600}.you small{color:var(--mut)}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--brand);width:26px;border-radius:9px}
.grp h4{margin:10px 0 6px}.opts{display:flex;flex-wrap:wrap;gap:8px}.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:12px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}.opt.active{border-color:var(--brand);background:var(--soft)}.sw{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.story{background:rgba(251,191,36,.18);border-radius:12px;padding:10px;margin-top:12px}.pv-title{color:#fff;text-align:center;font-weight:900;padding:4px;border-radius:12px;margin-bottom:8px}
.stars{margin-bottom:8px}.star-big{font-size:3rem;color:#d6d3d1;margin:0 4px}.star-big.on{color:#fbbf24;text-shadow:0 2px 10px rgba(251,191,36,.7);animation:pop .6s both}.star-big.on:nth-child(2){animation-delay:.2s}.star-big.on:nth-child(3){animation-delay:.4s}@keyframes pop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.end-t{text-align:center;font-weight:900;margin:12px 0 0}.end-t.g{color:#15803d}.end-t.w{color:#b45309}.end-t.d{color:#b91c1c}
.tips{background:rgba(13,148,136,.1);border-radius:14px;padding:10px 16px}.tips h4{margin:0}.tips li{margin:6px 0}.grand{text-align:center;background:linear-gradient(135deg,#fde68a,#fbbf24);color:#78350f;border-radius:16px;padding:12px;margin-top:12px}.grand h2,.grand h3{margin:0}.grand p{margin:4px 0 0}
.fade-in{animation:fi .4s}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.an-float{animation:fl 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.an-pulse{animation:pu 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.an-shake{animation:sh 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.an-fly{animation:fy 4s ease-in-out infinite}
@keyframes fl{to{transform:translateY(-3px)}}@keyframes pu{to{transform:scale(1.07)}}@keyframes sh{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}@keyframes fy{0%,100%{opacity:.95;transform:translate(0,0)}50%{opacity:.75;transform:translate(-6px,-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.music{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:99px;width:38px;height:34px;font-size:1.1rem;cursor:pointer}.music:focus-visible,.btn-main:focus-visible,.btn-sec:focus-visible,.choice:focus-visible,.btn-round:focus-visible,.opt:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
.hbtns{display:flex;gap:8px;align-items:center}

.house-wrap{aspect-ratio:4/3;background:#7dd3fc}.house-wrap .house-svg{width:100%;height:100%}
.floors{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}.floor-btn,.cam-btn{border:2px solid rgba(255,255,255,.9);background:rgba(15,23,42,.65);color:#fff;border-radius:12px;padding:4px 10px;font-weight:800;font-size:.85rem;cursor:pointer;backdrop-filter:blur(4px)}.floor-btn.on{background:var(--brand)}
.cam-btn{position:absolute;top:10px;left:10px}
.walker .legL,.walker .legR{transform-box:fill-box;transform-origin:50% 0}.walker.walking .legL{animation:lg .32s ease-in-out infinite alternate}.walker.walking .legR{animation:lg .32s ease-in-out infinite alternate-reverse}.walker.walking .wtop{animation:wb .32s ease-in-out infinite alternate}
@keyframes lg{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}@keyframes wb{to{transform:translateY(-7px) rotate(2deg)}}.walker .wtop{transform-box:fill-box;transform-origin:50% 100%}
.smoke{animation:sm 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes sm{to{transform:translateY(-6px);opacity:.3}}
.cloud2{animation:cl 60s linear infinite alternate}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:grid;place-items:center;padding:16px}.dlg{background:var(--card);color:var(--ink);border-radius:20px;border:2px solid var(--line);padding:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.dlg-h{display:flex;justify-content:space-between;align-items:center}.dlg h2{margin:0}.dlg h4{margin:14px 0 6px}.styles{display:grid;gap:6px;margin-top:8px}.opt.wide{width:100%;justify-content:flex-start;text-align:right}
.vol{display:flex;gap:10px;align-items:center;margin-top:10px;font-weight:700}.vol input{flex:1;accent-color:var(--brand)}
body.m-low .an-float,body.m-low .an-pulse,body.m-low .an-shake,body.m-low .an-fly,body.m-low .smoke,body.m-low .cloud,body.m-low .cloud2,body.m-low .dhow,body.m-low .pulse-tag{animation:none!important}
body.m-none *,body.m-none *::before{animation:none!important;transition:none!important}
body.m-none .walker.walking .legL,body.m-none .walker.walking .legR{animation:lg .32s ease-in-out infinite alternate!important}
.who{margin:10px 0 6px;font-weight:700}.who-chip.on{background:var(--c);color:#fff}
</style>
<header><h1>🇧🇭 عائلة الأمان الرقمي</h1><div class="hbtns"><button class="music" onclick="openSettings()" aria-label="الإعدادات">⚙️</button><button id="music-btn" class="music" onclick="toggleMusic()" aria-label="الموسيقى" aria-pressed="true">🔊</button><span class="prog">⭐ <span id="header-progress-count">0 / 5</span></span></div></header>
<main id="app-container"></main>
<script>

    return `<rect width="90" height="166" fill="#fff"/><rect width="90" height="30" fill="${p.hc || '#9333ea'}"/>${txt(45, 18, 'الملف الشخصي', 7, '#fff', 800)}${av}
      <circle cx="45" cy="54" r="21" fill="none" stroke="#fff" stroke-width="3"/>${txt(45, 92, p.h || 'حسابي', 8, '#0f172a', 800)}
      <rect x="14" y="98" width="62" height="14" rx="7" fill="${p.pub ? '#fee2e2' : '#dcfce7'}"/>${txt(45, 108, p.pub ? '🌍 حساب عام' : '🔒 حساب خاص', 6.2, p.pub ? '#b91c1c' : '#166534', 800)}
      ${txt(45, 126, (p.followers || (p.pub ? '2.4k' : '38')) + ' متابع', 6.4, '#475569')}${[0, 1, 2].map(i => `<rect x="${6 + i * 27}" y="134" width="24" height="24" rx="4" fill="#e2e8f0"/>`).join('')}`;
  }
  if (k === 'tog') return `<rect width="90" height="166" fill="#f8fafc"/>${hd(p.hc || '#0284c7', p.h || 'الخصوصية')}
    ${p.rows.map((r, i) => `<rect x="5" y="${32 + i * 32}" width="80" height="26" rx="7" fill="#fff" stroke="#e2e8f0"/>${txt(82, 48 + i * 32, r[0], 5.8, '#0f172a', 700, 'end')}<rect x="9" y="${39 + i * 32}" width="20" height="12" rx="6" fill="${r[1] ? '#22c55e' : '#cbd5e1'}"/><circle cx="${r[1] ? 23 : 15}" cy="${45 + i * 32}" r="4.5" fill="#fff"/>`).join('')}
    ${txt(45, 146, '🛡️ حسابك أكثر أماناً', 6.4, '#047857', 800)}`;
  // chat
  const hc = p.hc || '#075e54';
  let s = `<rect width="90" height="166" fill="#efeae2"/><rect width="90" height="24" fill="${hc}"/>${txt(45, 15, p.h || 'مجموعة الصديقات', 6.8, '#fff', 800)}`;
  if (p.badge) s += `<circle cx="78" cy="12" r="8" fill="#22c55e"/>${txt(78, 15, p.badge, 5.6, '#fff', 800)}`;
  let y = 30;
  for (const [side, lines, tone] of (p.b || [])) {
    if (lines[0] === '@sticker') { s += sticker(side === 'l' ? 6 : 44, y, 40, tone === 'x'); y += 46; continue; }
    const mx = Math.max(...lines.map(l => l.length));
    const w = Math.min(80, 16 + mx * 3.7), h = 8 + lines.length * 9, x = side === 'l' ? 4 : 86 - w;
    const fill = tone === 'x' ? '#fee2e2' : side === 'l' ? '#fff' : '#d9fdd3', st = tone === 'x' ? '#f87171' : tone === 'f' ? '#f87171' : 'none';
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${fill}" stroke="${st}"/>`;
    lines.forEach((l, i) => { s += txt(x + w / 2, y + 9 + i * 9, l, tone === 'f' && i === 0 ? 5 : 6.1, tone === 'f' && i === 0 ? '#64748b' : tone === 'f' && i === 1 ? '#dc2626' : tone === 'x' ? '#7f1d1d' : '#111827', tone === 'f' && i === 0 ? 500 : 700); });
    y += h + 5;
  }
  return s + `<rect x="5" y="146" width="80" height="14" rx="7" fill="#fff"/>${txt(45, 156, 'اكتب رسالة...', 5.4, '#94a3b8', 600)}`;
}

function phoneSVG(p, u) {
  const x = p.x ?? 352, y = p.y ?? 134, s = p.s ?? 1.2, r = p.r ?? -4;
  return `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})" filter="url(#dsh${u})">
    <ellipse rx="82" ry="112" fill="url(#halo${u})"/>
    <rect x="-44" y="-82" width="100" height="180" rx="15" fill="rgba(0,0,0,.28)"/><rect x="-50" y="-90" width="100" height="180" rx="15" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <rect x="-45" y="-83" width="90" height="166" rx="10" fill="#fff"/>
    <g clip-path="url(#cp${u})"><g transform="translate(-45 -83)">${phScreen(p)}</g></g>
    <rect x="-12" y="-88" width="24" height="4" rx="2" fill="#1e293b"/></g>`;
}

function renderCustomizeScreen() {
  const c = CHARACTERS[state.selectedCharId], a = state.appearances[c.id], o = c.customOptions, id = c.id;
  const grp = (title, items, key) => `<div class="grp"><h4>${title}</h4><div class="opts">${items.map(i => opt(i.id.startsWith('#') && key !== 'head' ? `<span class="sw" style="background:${i.id}"></span>${i.label}` : i.label, a[key] === i.id, `updateAppearance('${key}','${i.id}')`)).join('')}</div></div>`;
  return `<div class="fade-in two">
    <div class="panel pv"><div class="pv-title" style="background:${c.color}">${c.role} · ${c.name}</div>${renderScene('cust_' + id)}</div>
    <div class="panel"><h2 style="color:${c.color}">🎨 خصّص الشخصية</h2>
      ${grp('لون البشرة', o.skins, 'skin')}${grp('الملابس', o.outfits, 'outfit')}${grp('الشعر والغطاء', o.heads, 'head')}
      <div class="grp"><h4>النظارات</h4><div class="opts">${opt('بدون', !a.glasses, `updateAppearance('glasses',false)`)}${opt('👓 نظارة', a.glasses, `updateAppearance('glasses',true)`)}</div></div>
      <div class="story"><b>${c.scenarioTitle}</b><br>${c.scenarioSummary}</div>
      <div class="row"><button class="btn-sec" onclick="goToHouseMap()">← رجوع للبيت</button><button class="btn-main" onclick="startPrologue()">ابدأ الموقف ▶</button></div></div></div>`;
}

function renderPrologueScreen() {
  const c = CHARACTERS[state.selectedCharId], i = state.proIdx, p = c.prologue[i], last = i === c.prologue.length - 1;
  return `<div class="fade-in narrow"><div class="panel"><div class="tag" style="background:${c.color}">القصة · ${c.name}</div>
    <div class="scene-frame" key="${i}">${renderScene(p.sc)}</div>
    <p class="narr">${p.t}</p>
    <div class="dots">${c.prologue.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="row">${i > 0 ? `<button class="btn-sec" onclick="proStep(-1)">← السابق</button>` : `<button class="btn-sec" onclick="selectCharacter('${c.id}')">← الشخصية</button>`}
      <button class="btn-main" onclick="${last ? 'startDecisions()' : 'proStep(1)'}">${last ? 'ابدأ القرارات 🎯' : 'التالي ▶'}</button></div></div></div>`;
}
function proStep(d) { state.proIdx = clamp(state.proIdx + d, 0, 9); renderApp(); }

function shuffled(n) { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
function renderPlayScreen() {
  const c = CHARACTERS[state.selectedCharId], n = c.nodes[state.currentNodeId];
  if (!state.order.length) state.order = shuffled(n.choices.length);
  const L = ['أ', 'ب', 'ج', 'د'];
  return `<div class="fade-in narrow"><div class="panel"><div class="top"><span class="tag" style="background:${c.color}">${c.name} · ${c.scenarioTitle}</span><span class="step">المرحلة ${n.step} / ${n.totalSteps}</span></div>
    <div class="bar"><i style="width:${(n.step - 1) / n.totalSteps * 100 + 8}%;background:${c.color}"></i></div>
    <div class="scene-frame">${renderScene(n.sc)}</div>
    <p class="narr">${n.narrative}</p><h3 class="q">${n.question}</h3>
    <div class="choices">${state.order.map((idx, k) => `<button class="choice" onclick="pickChoice(${idx})"><b>${L[k]}</b><span>${n.choices[idx].text}</span></button>`).join('')}</div></div></div>`;
}
function pickChoice(idx) {
  const c = CHARACTERS[state.selectedCharId], n = c.nodes[state.currentNodeId];
  state.pending = n.choices[idx]; Music.stinger(state.pending.q); state.currentScreen = 'result'; renderApp();
}
const QMETA = { g: ['✅ قرار ممتاز', 'g'], o: ['⚠️ قرار مقبول لكن ينقصه شيء', 'w'], b: ['❌ قرار خطر', 'd'] };
function renderResultScreen() {
  const c = CHARACTERS[state.selectedCharId], ch = state.pending, [lbl, cl] = QMETA[ch.q];
  return `<div class="fade-in narrow"><div class="panel"><div class="top"><span class="tag" style="background:${c.color}">ماذا حدث؟</span><span class="verdict ${cl}">${lbl}</span></div>
    <div class="scene-frame ${cl}">${renderScene(ch.sc)}</div>
    <div class="you"><small>اخترت:</small> ${ch.text}</div>
    <p class="narr big">${ch.res}</p>
    <div class="row end"><button class="btn-main" onclick="afterResult()">${c.endings[ch.next] ? 'شاهد النهاية 🎬' : 'التالي ▶'}</button></div></div></div>`;
}
function afterResult() { state.pending && chooseOption(state.pending.next); }

function renderEndingScreen() {
  const c = CHARACTERS[state.selectedCharId], e = c.endings[state.currentNodeId];
  const key = e.type === 'safe' ? 'end_safe' : e.type === 'warning' ? 'end_warn' : 'end_bad';
  const cls = e.type === 'safe' ? 'g' : e.type === 'warning' ? 'w' : 'd';
  const cnt = safeCount();
  return `<div class="fade-in narrow"><div class="panel end ${cls}"><div class="center stars">${stars(e.stars, true)}</div>
    <div class="scene-frame ${cls}">${renderScene(key)}</div><h2 class="end-t ${cls}">${e.title}</h2><p class="narr">${e.summary}</p>
    <div class="tips"><h4>💡 نصائح للحفظ</h4><ul>${e.tips.map(t => `<li>${t}</li>`).join('')}</ul></div>
    ${cnt === 5 && e.type === 'safe' ? `<div class="grand"><h3>🏆 مبروك! أنقذت العائلة كلها</h3><p>3 نجوم في الغرف الخمس. بيتكم صار حصناً رقمياً بحرينياً.</p></div>` : ''}
    <div class="row"><button class="btn-sec" onclick="startPrologue()">↺ جرّب قراراً آخر</button><button class="btn-main" onclick="goToHouseMap()">🏠 العودة للبيت</button></div></div></div>`;
}

function renderCurrent() {
  switch (state.currentScreen) {
    case 'map': return renderHouseMap(); case 'customize': return renderCustomizeScreen(); case 'prologue': return renderPrologueScreen();
    case 'play': return renderPlayScreen(); case 'result': return renderResultScreen(); default: return renderEndingScreen();
  }
}
function screenMood() {
  const sc = state.currentScreen;
  if (sc === 'map' || sc === 'customize') return 'home';
  if (sc === 'prologue' || sc === 'play') return 'tense';
  if (sc === 'result') return { g: 'bright', o: 'home', b: 'dark' }[state.pending && state.pending.q] || 'tense';
  const e = CHARACTERS[state.selectedCharId].endings[state.currentNodeId];
  return e.type === 'safe' ? 'victory' : e.type === 'warning' ? 'home' : 'sad';
}
function renderApp() {
  document.getElementById('app-container').innerHTML = renderCurrent();
  document.getElementById('header-progress-count').textContent = `${safeCount()} / 5`;
  Music.mood(screenMood());
  if (state.currentScreen === 'map') {
    initHouse();
    document.querySelectorAll('.hold').forEach(b => { const d = +b.dataset.d; let iv; const go = () => { nudge(d * 14); }; const on = e => { e.preventDefault(); go(); iv = setInterval(go, 40); }; const off = () => clearInterval(iv); b.onpointerdown = on; b.onpointerup = off; b.onpointerleave = off; b.onpointercancel = off; });
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function goToHouseMap() { state.currentScreen = 'map'; renderApp(); }
function selectCharacter(id) { state.selectedCharId = id; state.currentScreen = 'customize'; renderApp(); }
function updateAppearance(k, v) { state.appearances[state.selectedCharId][k] = v; saveGame(); renderApp(); }
function startPrologue() { state.proIdx = 0; state.currentScreen = 'prologue'; renderApp(); }
function startDecisions() { Music.stinger('start'); const c = CHARACTERS[state.selectedCharId]; state.currentNodeId = c.startNode; state.history = [c.startNode]; state.order = []; state.currentScreen = 'play'; renderApp(); }
function chooseOption(next) {
  const c = CHARACTERS[state.selectedCharId]; state.currentNodeId = next; state.history.push(next); state.order = []; state.pending = null;
  if (c.endings[next]) {
    const t = c.endings[next].type, prev = state.completed[c.id], rank = { safe: 3, warning: 2, bad: 1, null: 0 };
    if (rank[t] >= rank[prev]) state.completed[c.id] = t;
    saveGame(); state.currentScreen = 'ending';
    renderApp(); setTimeout(() => Music.stinger(t === 'safe' ? 'win' : t === 'bad' ? 'lose' : 'o'), 250); return;
  } else state.currentScreen = 'play';
  renderApp();
}
function resetAllProgress() { ORDER.forEach(id => state.completed[id] = null); saveGame(); renderApp(); }
// ---------------------------------------------------------------- الإعدادات
const BGS = {
  cream: ['كريمي', '#fdf6e3', '#fffdf7', '#e7d6b0', '#1f2937', '#64748b'], sky: ['سماوي', '#dff1fb', '#f7fcff', '#b6dcf0', '#0f2a3d', '#527089'],
  mint: ['نعناعي', '#e1f6e8', '#f8fffa', '#b7e4c7', '#0f3320', '#4f7a63'], rose: ['وردي', '#fde6ee', '#fff8fb', '#f6c1d4', '#4a1530', '#8a5b70'],
  sand: ['رملي', '#f1e2c6', '#fbf4e4', '#dcc79a', '#3b2a12', '#7d6a45'], night: ['ليلي', '#101826', '#1b2536', '#33425c', '#f1f5f9', '#9aa8bf']
};
const MUSIC_STYLES = [['auto', '🎬 تلقائية حسب الموقف والقرار (موصى بها)'], ['calm', '🌿 هادئة بحرينية'], ['festive', '🥁 حماسية إيقاعية'], ['serious', '🎭 جدية مشوّقة'], ['sad', '🎻 ناي حزين'], ['off', '🔇 بدون موسيقى']];
const PREF_KEY = 'bh-prefs';
const prefs = { bg: 'cream', motion: 'normal', player: 'father' };
function setPlayer(id) { state.player = id; prefs.player = id; try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) { } renderApp(); }
function applyPrefs() {
  const b = BGS[prefs.bg] || BGS.cream, r = document.documentElement.style;
  if (prefs.bg === 'cream') ['--bg', '--card', '--line', '--ink', '--mut'].forEach(k => r.removeProperty(k));
  else { r.setProperty('--bg', b[1]); r.setProperty('--card', b[2]); r.setProperty('--line', b[3]); r.setProperty('--ink', b[4]); r.setProperty('--mut', b[5]); }
  document.documentElement.style.colorScheme = prefs.bg === 'night' ? 'dark' : '';
  document.body.classList.toggle('m-low', prefs.motion === 'low'); document.body.classList.toggle('m-none', prefs.motion === 'none');
}
function loadPrefs() { try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) { } state.player = CHARACTERS[prefs.player] ? prefs.player : 'father'; applyPrefs(); }
function setPref(k, v) { prefs[k] = v; try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) { } applyPrefs(); renderSettings(); }
function setMusic(k, v) { Music.set(k, v); updateMusicBtn(); renderSettings(); }
function updateMusicBtn() { const b = document.getElementById('music-btn'); if (b) { const on = Music.S.on && Music.S.style !== 'off'; b.textContent = on ? '🔊' : '🔇'; b.setAttribute('aria-pressed', on); } }
function toggleMusic() { Music.set('on', !Music.S.on); if (Music.S.on && Music.S.style === 'off') Music.set('style', 'auto'); updateMusicBtn(); renderSettings(); }
function openSettings() { state.settingsOpen = true; renderSettings(); }
function closeSettings() { state.settingsOpen = false; renderSettings(); }
function renderSettings() {
  let el = document.getElementById('settings'); if (!el) { el = document.createElement('div'); el.id = 'settings'; document.body.appendChild(el); }
  if (!state.settingsOpen) { el.innerHTML = ''; return; }
  const S = Music.S;
  el.innerHTML = `<div class="ov" onclick="if(event.target===this)closeSettings()"><div class="dlg" role="dialog" aria-label="الإعدادات">
    <div class="dlg-h"><h2>⚙️ الإعدادات</h2><button class="btn-round" onclick="closeSettings()" aria-label="إغلاق">✕</button></div>
    <h4>🎵 الموسيقى</h4>
    <div class="opts"><button class="opt ${S.on ? 'active' : ''}" onclick="setMusic('on',${!S.on})">${S.on ? '🔊 مفعّلة' : '🔇 متوقفة'}</button><button class="opt ${S.sfx ? 'active' : ''}" onclick="setMusic('sfx',${!S.sfx})">🔔 أصوات القرارات: ${S.sfx ? 'تشغيل' : 'إيقاف'}</button></div>
    <label class="vol">مستوى الصوت <input type="range" min="0" max="100" value="${Math.round(S.vol * 100)}" oninput="Music.set('vol',this.value/100)"></label>
    <div class="styles">${MUSIC_STYLES.map(([k, t]) => `<button class="opt wide ${S.style === k ? 'active' : ''}" onclick="setMusic('style','${k}')">${t}</button>`).join('')}</div>
    <p class="tiny">في الوضع التلقائي: موسيقى هادئة في البيت، وجدية عند بدء الموقف، وتتغير مع كل قرار صحيح أو خاطئ، وموسيقى احتفال عند الفوز.</p>
    <h4>🎨 لون الخلفية</h4>
    <div class="opts">${Object.entries(BGS).map(([k, v]) => `<button class="opt ${prefs.bg === k ? 'active' : ''}" onclick="setPref('bg','${k}')"><span class="sw" style="background:${v[1]}"></span>${v[0]}</button>`).join('')}</div>
    <h4>✨ الحركة</h4>
    <div class="opts">${[['normal', 'عادية'], ['low', 'خفيفة'], ['none', 'بدون حركة']].map(([k, t]) => `<button class="opt ${prefs.motion === k ? 'active' : ''}" onclick="setPref('motion','${k}')">${t}</button>`).join('')}</div>
    <div class="row end"><button class="btn-main" onclick="closeSettings()">تم</button></div></div></div>`;
}
function boot() { loadGame(); Music.load(); loadPrefs(); updateMusicBtn(); renderApp(); }
if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', boot); else boot();

</script>
</body>
</html>
